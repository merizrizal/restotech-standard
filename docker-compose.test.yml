services:
  mariadb:
    image: mariadb:12.3.2
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: restotech_standard_test
      MARIADB_USER: restotech
      MARIADB_PASSWORD: restotech
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.test
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["sleep", "infinity"]
    environment:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: restotech_standard_test
      DB_USERNAME: restotech
      DB_PASSWORD: restotech
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    stdin_open: true
